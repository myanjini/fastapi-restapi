services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # .env에서 읽어 옵니다.
      POSTGRES_DB: bookapi
    volumes:
      - db-data:/var/lib/postgresql  # 데이터를 컨테이너 밖 볼륨에 저장합니다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookapi -d bookapi"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped  # 멈추면 다시 시작합니다(직접 멈춘 경우는 제외).
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://bookapi:${POSTGRES_PASSWORD}@db:5432/bookapi
      SECRET_KEY: ${SECRET_KEY}
      LOG_LEVEL: INFO
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db-data:
  uploads:
